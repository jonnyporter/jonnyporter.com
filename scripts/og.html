<!DOCTYPE html>
<!--
  Source for public/og.png, the 1200×630 link-preview card.
  To regenerate: open this file in a browser at exactly 1200×630 and
  screenshot it (or use headless Chrome: --screenshot --window-size=1200,630).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500..700&family=JetBrains+Mono:wght@400..700&family=Instrument+Serif:ital@1&display=block"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: #0a0a0f;
        color: #f6f6f9;
        font-family: "Space Grotesk", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 38% 52% at 84% 46%, rgba(255, 209, 102, 0.3), transparent 70%),
          radial-gradient(ellipse 60% 34% at 80% 52%, rgba(255, 107, 53, 0.26), transparent 70%),
          radial-gradient(ellipse 50% 70% at 96% 80%, rgba(95, 201, 248, 0.2), transparent 70%),
          radial-gradient(ellipse 40% 50% at 8% 0%, rgba(183, 148, 244, 0.14), transparent 70%);
      }
      .rings {
        position: absolute;
        right: -70px;
        top: 50%;
        width: 520px;
        height: 520px;
        translate: 0 -50%;
      }
      .wrap {
        position: absolute;
        inset: 0;
        padding: 64px 72px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 18px;
        font-family: "JetBrains Mono", monospace;
        font-size: 22px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #c3c3d0;
      }
      h1 {
        font-size: 92px;
        font-weight: 700;
        line-height: 0.98;
        letter-spacing: -0.035em;
      }
      h1 span { display: block; }
      .serif {
        font-family: "Instrument Serif", Georgia, serif;
        font-style: italic;
        font-weight: 400;
        letter-spacing: -0.01em;
      }
      .warm {
        background: linear-gradient(135deg, #ff6b35, #ffd166);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .cool {
        background: linear-gradient(135deg, #5fc9f8, #b794f4);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .bottom {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        font-family: "JetBrains Mono", monospace;
        font-size: 21px;
        letter-spacing: 0.06em;
        color: #a9a9b8;
      }
      .bottom b { color: #f6f6f9; font-weight: 500; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <svg class="rings" viewBox="0 0 40 40" fill="none">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#ff6b35" />
          <stop offset=".5" stop-color="#ffd166" />
          <stop offset="1" stop-color="#5fc9f8" />
        </linearGradient>
      </defs>
      <circle cx="20" cy="20" r="19" stroke="#f6f6f9" stroke-opacity=".28" stroke-width=".35" />
      <circle cx="20" cy="20" r="12" stroke="url(#g)" stroke-width=".7" />
      <circle cx="20" cy="20" r="3.2" fill="url(#g)" />
    </svg>
    <div class="wrap">
      <div class="top">
        <svg width="46" height="46" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="18" stroke="#f6f6f9" stroke-opacity=".5" stroke-width="1.2" />
          <circle cx="20" cy="20" r="11" stroke="url(#g)" stroke-width="1.5" />
          <circle cx="20" cy="20" r="3" fill="url(#g)" />
        </svg>
        Jonny Porter
      </div>
      <h1>
        <span>Tests <i class="serif">by day,</i></span>
        <span><em class="cool" style="font-style: normal">photos</em> <i class="serif">by light,</i></span>
        <span>apps <i class="serif warm">on the side.</i></span>
      </h1>
      <div class="bottom">
        <span><b>QA Engineer</b> · Photographer · Founder of Oovra</span>
        <span>jonnyporter.com</span>
      </div>
    </div>
  </body>
</html>
